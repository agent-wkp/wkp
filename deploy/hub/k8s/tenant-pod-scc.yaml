# A custom SecurityContextConstraints for the ServiceAccount that runs
# `wkp-hub serve` with `WKP_HUB_POD_ORCHESTRATOR=kubernetes` (issue
# #141). Needed because OpenShift's SCC admission evaluates the
# *caller's* identity (the ServiceAccount whose token issues the
# `kubectl apply` that creates a tenant Pod), not just the resulting
# Pod's own spec -- and every built-in SCC that ServiceAccount can use
# restricts `seccompProfiles` to `runtime/default` only. Confirmed
# against a real OpenShift cluster, not assumed: creating a tenant Pod
# under the plain `anyuid`-only grant this same effort had already
# tested and kept fails with `pod.metadata.annotations[...]:
# localhost/wkp-hub-seccomp-no-network.json is not an allowed seccomp
# profile. Valid values are [runtime/default]` -- the tenant Pod's
# `index-worker` container needs exactly that custom profile (its whole
# network-isolation mechanism on this backend, see
# `docs/adr/0012-pod-orchestrator-abstraction.md`'s 2026-09-20 addendum).
#
# This is an exact copy of the built-in `restricted-v2` SCC (`oc get scc
# restricted-v2 -o yaml`, 2026-09-20) with exactly one field widened:
# `seccompProfiles` gains this one named profile, nothing else. No host
# access, no privilege escalation, `ALL` capabilities still dropped, UID
# still `MustRunAsRange` (not `anyuid` -- the tenant Pod's own
# containers never ask for a specific UID, so the namespace's normal
# arbitrary-UID assignment already works for them, exactly as it does
# for the front door itself -- see `paperless-ink/infra`'s
# `ops/secrets.md` for that earlier, separate finding).
apiVersion: security.openshift.io/v1
kind: SecurityContextConstraints
metadata:
  name: wkp-hub-tenant-scc
allowHostDirVolumePlugin: false
allowHostIPC: false
allowHostNetwork: false
allowHostPID: false
allowHostPorts: false
allowPrivilegeEscalation: false
allowPrivilegedContainer: false
allowedCapabilities: null
defaultAddCapabilities: null
fsGroup:
  type: MustRunAs
priority: null
readOnlyRootFilesystem: false
requiredDropCapabilities:
  - ALL
runAsUser:
  type: MustRunAsRange
seLinuxContext:
  type: MustRunAs
seccompProfiles:
  - runtime/default
  - localhost/wkp-hub-seccomp-no-network.json
supplementalGroups:
  type: RunAsAny
users: []
groups: []
volumes:
  - configMap
  - csi
  - downwardAPI
  - emptyDir
  - ephemeral
  - persistentVolumeClaim
  - projected
  - secret

# Apply the SCC above (`oc apply -f`), then bind it to the front door's
# own ServiceAccount (the one issuing the `kubectl apply` calls) with:
#
#   oc adm policy add-scc-to-user wkp-hub-tenant-scc -z wkp-hub-frontdoor -n <namespace>
