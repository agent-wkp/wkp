[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-wkp"
version = "0.3.0"
description = "RETIRED — agent-wkp has moved to a Rust binary (wkp); see the project's GitHub Releases"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [
    { name = "William Caban", email = "william.caban@gmail.com" },
]
classifiers = [
    "Development Status :: 7 - Inactive",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]

[project.urls]
Homepage      = "https://github.com/williamcaban/agent-wkp"
Repository    = "https://github.com/williamcaban/agent-wkp"
"Design doc"  = "https://github.com/williamcaban/agent-wkp/blob/v2-rust/docs/design/wkp-hub-design-v0.1.md"
Releases      = "https://github.com/williamcaban/agent-wkp/releases"

[project.scripts]
wkp = "wkp_tombstone:main"

[tool.hatch.build.targets.wheel]
packages = ["src/wkp_tombstone"]
